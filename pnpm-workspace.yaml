packages:
  - examples
  - packages/**

allowBuilds:
  esbuild: false

# 重複排除
dedupePeers: true

catalog:
  aws-amplify: 6.20.0
  jsdom: 30.0.1
  playwright: 1.62.1
  qrcode.react: 4.2.0
  react: &react_ver 19.2.8
  react-dom: *react_ver
  rolldown: 1.2.4
  rolldown-plugin-dts: 0.28.2
  turbo: 2.10.11
  typescript: 7.0.2
  vite: 8.2.1
  vitest: &vitest_ver 4.1.11
  xstate: 5.32.5
  '@aws-amplify/auth': 6.20.0
  '@aws-amplify/core': 6.18.0
  '@biomejs/biome': 2.5.9
  '@fast-check/vitest': 0.4.1
  '@types/node': 26.2.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.0.5
  '@testing-library/react': 16.3.2
  '@vitest/browser': *vitest_ver
  '@vitest/coverage-v8': *vitest_ver
  '@vitest/expect': *vitest_ver
  '@vitest/mocker': *vitest_ver
  '@vitest/spy': *vitest_ver
  '@xstate/react': 6.1.0

overrides:
  # CVE-2026-69152
  brace-expansion: '>=5.0.9'
  # GHSA-g7r4-m6w7-qqqr
  esbuild: '>=0.28.1'
  # GHSA-8r6m-32jq-jx6q
  fast-xml-parser: '>=5.10.1'
  # CVE-2026-67213
  nanoid: ^3.3.17
  rolldown: 'catalog:'
  '@vitest/expect': 'catalog:'
  '@vitest/mocker': 'catalog:'
  '@vitest/spy': 'catalog:'

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
